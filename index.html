<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>นักล่าแม่สูตรคูณ AR</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<video id="camFeed" autoplay playsinline muted></video>
<div id="dim"></div>

<!-- START -->
<div id="startScreen" class="screen">
  <div class="title-wrap">
    <div class="eyebrow">AR Math Arena · ป.3</div>
    <h1 class="game-title">นักล่า<span>แม่สูตรคูณ</span></h1>
  </div>
  <p class="subtitle">ชี้นิ้วไปที่คำตอบที่ถูกต้อง แล้วค้างไว้ 3 วินาทีเพื่อยืนยัน!</p>

  <div class="table-picker" id="tablePicker"></div>
  <div class="picker-actions">
    <button id="selectAll">เลือกทั้งหมด</button>
    <button id="selectNone">ล้างตัวเลือก</button>
  </div>

  <div class="hand-status" id="handStatus">
    <span class="dot"></span>
    <span class="label">กำลังเตรียมระบบตรวจจับมือ...</span>
  </div>

  <button class="big-btn" id="startBtn">เปิดกล้อง &amp; เริ่มเกม</button>
  <button id="cameraToggleStart" class="cam-toggle-btn">🔄 สลับเป็นกล้องหลัง</button>

  <p class="ghost-note">ให้นักเรียนยืนหน้าห้อง ยกไอแพดขึ้นเล็กน้อย ยกมือขึ้นในกล้อง แล้วชี้นิ้วชี้ไปที่ลูกโป่งคำตอบค้างไว้ 3 วิ (หรือแตะหน้าจอแทนก็ได้)</p>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="pill" id="scorePill">⭐ <span id="scoreVal">0</span></div>
  <div class="pill" id="timerPill">⏱ <span id="timeVal">45</span></div>
</div>
<div id="questionBar" class="hidden"></div>
<div id="bubbleLayer"></div>
<button id="cameraToggleHud" class="hidden">🔄 สลับกล้อง</button>
<div id="handCursor"></div>

<!-- END -->
<div id="endScreen" class="screen hidden">
  <div id="endLabel">สรุปผลการเล่น</div>
  <div id="endScore">0</div>
  <div id="endMsg"></div>
  <button class="big-btn" id="playAgainBtn">เล่นอีกครั้ง (คนต่อไป)</button>
</div>

<div id="camError" class="hidden"></div>

<script type="module" src="game.js"></script>
</body>
</html>
