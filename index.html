<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>นักล่าแม่สูตรคูณ AR</title>
<style>
  :root{
    --ink:#0e1630;
    --sun:#ffc93c;
    --sun-deep:#f2a900;
    --mango:#ff8b3d;
    --grape:#7b5cff;
    --lime:#38e8b0;
    --berry:#ff4d7e;
    --paper:#fff8ec;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden; background:#000;
    font-family:'Kanit','Sarabun',-apple-system,'Segoe UI',sans-serif;
    touch-action:none;
  }
  #camFeed{
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; z-index:0; transform:scaleX(-1);
  }
  #dim{
    position:fixed; inset:0; z-index:1;
    background:linear-gradient(180deg, rgba(14,22,48,.35) 0%, rgba(14,22,48,.05) 20%, rgba(14,22,48,.05) 75%, rgba(14,22,48,.55) 100%);
    pointer-events:none;
  }
  .screen{
    position:fixed; inset:0; z-index:20;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .hidden{display:none !important;}

  /* ---- START SCREEN ---- */
  #startScreen{ background:radial-gradient(circle at 30% 20%, #2a1f6b 0%, #0e1630 65%); gap:18px;}
  .title-wrap{ position:relative; margin-bottom:6px;}
  .eyebrow{
    font-size:15px; letter-spacing:.35em; color:var(--lime); font-weight:600; text-transform:uppercase;
  }
  h1.game-title{
    font-size:clamp(34px,7vw,64px); margin:4px 0 0; color:var(--paper);
    font-weight:800; line-height:1.05; text-shadow:0 4px 0 var(--berry), 0 10px 24px rgba(0,0,0,.4);
  }
  h1.game-title span{color:var(--sun);}
  .subtitle{color:#c8cdf0; font-size:clamp(14px,2.4vw,18px); max-width:540px; margin-top:2px;}

  .table-picker{
    display:grid; grid-template-columns:repeat(6,1fr); gap:10px;
    background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    padding:16px; border-radius:20px; max-width:640px; width:100%; backdrop-filter:blur(6px);
  }
  .table-chip{
    padding:12px 0; border-radius:14px; font-size:20px; font-weight:700;
    background:rgba(255,255,255,.08); color:#d8dcff; border:2px solid transparent; cursor:pointer;
  }
  .table-chip.active{
    background:var(--sun); color:var(--ink); border-color:var(--sun-deep);
    box-shadow:0 6px 0 var(--sun-deep);
    transform:translateY(-2px);
  }
  .picker-actions{display:flex; gap:10px; font-size:13px; color:#b7bcec;}
  .picker-actions button{
    background:none; border:1px solid rgba(255,255,255,.25); color:#e5e7ff;
    padding:6px 14px; border-radius:999px; font-size:13px; cursor:pointer;
  }

  .big-btn{
    font-family:inherit; font-weight:800; font-size:clamp(20px,3.4vw,28px);
    padding:18px 46px; border-radius:999px; border:none; cursor:pointer;
    color:var(--ink); background:linear-gradient(180deg,var(--lime),#1fcf9a);
    box-shadow:0 8px 0 #0f9e78, 0 14px 26px rgba(0,0,0,.35);
    transition:transform .06s ease;
  }
  .big-btn:active{ transform:translateY(6px); box-shadow:0 2px 0 #0f9e78; }
  .ghost-note{ font-size:13px; color:#9aa0d8; max-width:420px;}

  /* ---- GAME HUD ---- */
  #hud{
    position:fixed; top:0; left:0; right:0; z-index:15;
    display:flex; align-items:flex-start; justify-content:space-between;
    padding:max(14px, env(safe-area-inset-top)) 18px 0;
    pointer-events:none;
  }
  .pill{
    background:rgba(14,22,48,.55); border:1px solid rgba(255,255,255,.18);
    backdrop-filter:blur(6px); border-radius:16px; padding:10px 16px;
    color:var(--paper); font-weight:700; display:flex; align-items:center; gap:8px;
  }
  #scorePill{color:var(--sun); font-size:20px;}
  #timerPill{font-size:20px; min-width:82px; justify-content:center;}
  #timerPill.low{ color:var(--berry); animation:pulse .5s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1)} 50%{transform:scale(1.08)}}

  #questionBar{
    position:fixed; top:74px; left:50%; transform:translateX(-50%); z-index:15;
    background:var(--paper); color:var(--ink);
    padding:14px 34px; border-radius:20px;
    font-size:clamp(30px,6vw,52px); font-weight:800;
    box-shadow:0 10px 0 #d8c9a3, 0 18px 30px rgba(0,0,0,.35);
    border:4px solid var(--sun-deep);
  }

  #bubbleLayer{ position:fixed; inset:0; z-index:10; }
  .bubble{
    position:absolute; width:20vw; height:20vw; max-width:150px; max-height:150px; min-width:96px; min-height:96px;
    border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:clamp(28px,5vw,40px); font-weight:800; color:var(--paper);
    cursor:pointer; border:4px solid rgba(255,255,255,.55);
    box-shadow:0 10px 18px rgba(0,0,0,.35), inset 0 -8px 14px rgba(0,0,0,.15), inset 0 8px 14px rgba(255,255,255,.25);
    animation:floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty{
    0%{ transform:translateY(0px) }
    50%{ transform:translateY(-16px) }
    100%{ transform:translateY(0px) }
  }
  .bubble.pop{ animation:popAway .35s forwards; }
  @keyframes popAway{ to{ transform:scale(1.6); opacity:0; } }
  .bubble.shake{ animation:shakeIt .35s; }
  @keyframes shakeIt{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-10px) rotate(-4deg)}
    75%{transform:translateX(10px) rotate(4deg)}
  }

  .confetti{
    position:absolute; width:10px; height:14px; opacity:.95; pointer-events:none;
    animation:confettiFall 900ms ease-out forwards;
  }
  @keyframes confettiFall{
    to{ transform:translateY(60px) rotate(280deg); opacity:0; }
  }

  /* ---- END SCREEN ---- */
  #endScreen{ background:radial-gradient(circle at 70% 30%, #2a1f6b 0%, #0e1630 65%); gap:14px;}
  #endScore{ font-size:clamp(60px,12vw,110px); color:var(--sun); font-weight:800; text-shadow:0 6px 0 var(--berry);}
  #endLabel{ color:#c8cdf0; font-size:18px; letter-spacing:.1em;}
  #endMsg{ color:var(--paper); font-size:clamp(18px,3vw,24px); font-weight:700; max-width:480px;}

  #camError{
    position:fixed; inset:0; z-index:30; background:#0e1630; color:var(--paper);
    display:flex; align-items:center; justify-content:center; text-align:center; padding:32px;
    font-size:17px; line-height:1.6;
  }
</style>
</head>
<body>

<video id="camFeed" autoplay playsinline muted></video>
<div id="dim"></div>

<!-- START -->
<div id="startScreen" class="screen">
  <div class="title-wrap">
    <div class="eyebrow">AR Math Arena · ป.3</div>
    <h1 class="game-title">นักล่า<span>แม่สูตรคูณ</span></h1>
  </div>
  <p class="subtitle">แตะลูกโป่งที่มีคำตอบถูกต้องให้ไวที่สุด ก่อนเวลาจะหมด!</p>

  <div class="table-picker" id="tablePicker"></div>
  <div class="picker-actions">
    <button id="selectAll">เลือกทั้งหมด</button>
    <button id="selectNone">ล้างตัวเลือก</button>
  </div>

  <button class="big-btn" id="startBtn">เปิดกล้อง &amp; เริ่มเกม</button>
  <p class="ghost-note">ให้นักเรียนยืนหน้าห้อง ยกไอแพดขึ้นเล็กน้อย แล้วแตะลูกโป่งบนหน้าจอ (ต้องอนุญาตให้ใช้กล้องนะครับ)</p>
</div>

<!-- HUD -->
<div id="hud" class="hidden">
  <div class="pill" id="scorePill">⭐ <span id="scoreVal">0</span></div>
  <div class="pill" id="timerPill">⏱ <span id="timeVal">45</span></div>
</div>
<div id="questionBar" class="hidden"></div>
<div id="bubbleLayer"></div>

<!-- END -->
<div id="endScreen" class="screen hidden">
  <div id="endLabel">สรุปผลการเล่น</div>
  <div id="endScore">0</div>
  <div id="endMsg"></div>
  <button class="big-btn" id="playAgainBtn">เล่นอีกครั้ง (คนต่อไป)</button>
</div>

<div id="camError" class="hidden"></div>

<script>
(function(){
  "use strict";

  // ---------- CONFIG ----------
  const ROUND_SECONDS = 45;
  const OPTIONS_COUNT = 4;
  const BUBBLE_COLORS = ["#ff4d7e","#7b5cff","#38e8b0","#ff8b3d","#3ba7ff","#ffc93c"];

  // ---------- STATE ----------
  let selectedTables = new Set([2,3,4,5,6,7,8,9,10]);
  let score = 0;
  let timeLeft = ROUND_SECONDS;
  let timerHandle = null;
  let currentAnswer = null;
  let roundActive = false;
  let stream = null;

  // ---------- DOM ----------
  const $ = (id)=>document.getElementById(id);
  const startScreen = $("startScreen");
  const endScreen = $("endScreen");
  const hud = $("hud");
  const questionBar = $("questionBar");
  const bubbleLayer = $("bubbleLayer");
  const scoreVal = $("scoreVal");
  const timeVal = $("timeVal");
  const timerPill = $("timerPill");
  const camFeed = $("camFeed");
  const camError = $("camError");

  // ---------- BUILD TABLE PICKER ----------
  const tablePicker = $("tablePicker");
  for(let n=2; n<=12; n++){
    const chip = document.createElement("div");
    chip.className = "table-chip" + (selectedTables.has(n) ? " active" : "");
    chip.textContent = "แม่ " + n;
    chip.dataset.n = n;
    chip.addEventListener("click", ()=>{
      const num = Number(chip.dataset.n);
      if(selectedTables.has(num)){ selectedTables.delete(num); chip.classList.remove("active"); }
      else { selectedTables.add(num); chip.classList.add("active"); }
    });
    tablePicker.appendChild(chip);
  }
  $("selectAll").addEventListener("click", ()=>{
    selectedTables = new Set(Array.from({length:11},(_,i)=>i+2));
    [...tablePicker.children].forEach(c=>c.classList.add("active"));
  });
  $("selectNone").addEventListener("click", ()=>{
    selectedTables.clear();
    [...tablePicker.children].forEach(c=>c.classList.remove("active"));
  });

  // ---------- CAMERA ----------
  async function startCamera(){
    try{
      stream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:"user", width:{ideal:1280}, height:{ideal:720} },
        audio:false
      });
      camFeed.srcObject = stream;
      camFeed.style.transform = "scaleX(-1)"; // front camera: mirror like a selfie
      return true;
    }catch(e){
      camError.classList.remove("hidden");
      camError.innerHTML = "เปิดกล้องไม่ได้ 😢<br><br>" +
        "กรุณาอนุญาตการใช้กล้องในเบราว์เซอร์ และตรวจสอบว่าเปิดหน้านี้ผ่าน https (เช่น GitHub Pages)<br>" +
        "<br><small>" + (e && e.message ? e.message : "") + "</small>";
      return false;
    }
  }

  // ---------- GAME FLOW ----------
  $("startBtn").addEventListener("click", async ()=>{
    if(selectedTables.size === 0){
      selectedTables.add(2); selectedTables.add(5);
      tablePicker.children[0].classList.add("active");
      tablePicker.children[3].classList.add("active");
    }
    const ok = await startCamera();
    if(!ok) return;
    startScreen.classList.add("hidden");
    hud.classList.remove("hidden");
    questionBar.classList.remove("hidden");
    beginRound();
  });

  $("playAgainBtn").addEventListener("click", ()=>{
    endScreen.classList.add("hidden");
    hud.classList.remove("hidden");
    questionBar.classList.remove("hidden");
    beginRound();
  });

  function beginRound(){
    score = 0;
    timeLeft = ROUND_SECONDS;
    scoreVal.textContent = score;
    timeVal.textContent = timeLeft;
    timerPill.classList.remove("low");
    roundActive = true;
    nextQuestion();
    clearInterval(timerHandle);
    timerHandle = setInterval(()=>{
      timeLeft--;
      timeVal.textContent = timeLeft;
      if(timeLeft <= 10) timerPill.classList.add("low");
      if(timeLeft <= 0){ endRound(); }
    }, 1000);
  }

  function endRound(){
    roundActive = false;
    clearInterval(timerHandle);
    bubbleLayer.innerHTML = "";
    hud.classList.add("hidden");
    questionBar.classList.add("hidden");
    $("endScore").textContent = score;
    $("endMsg").textContent = pickEndMessage(score);
    endScreen.classList.remove("hidden");
  }

  function pickEndMessage(s){
    if(s >= 20) return "สุดยอดนักล่าแม่สูตร! 🏆";
    if(s >= 12) return "เก่งมาก! เกือบมือโปรแล้ว 🎉";
    if(s >= 6) return "ทำได้ดี ลองอีกครั้งให้เร็วขึ้น 💪";
    return "ไม่เป็นไร ลองใหม่อีกครั้งนะ 🙂";
  }

  // ---------- QUESTION LOGIC ----------
  function nextQuestion(){
    bubbleLayer.innerHTML = "";
    const tables = Array.from(selectedTables);
    const a = tables[Math.floor(Math.random()*tables.length)];
    const b = Math.floor(Math.random()*11) + 2; // 2..12
    const answer = a*b;
    currentAnswer = answer;
    questionBar.textContent = a + " × " + b + " = ?";

    const options = new Set([answer]);
    while(options.size < OPTIONS_COUNT){
      const delta = Math.floor(Math.random()*10) - 5;
      let wrong = answer + (delta === 0 ? 3 : delta) * (Math.random()<0.5?1:2);
      wrong = Math.max(1, Math.round(wrong));
      if(wrong !== answer) options.add(wrong);
    }
    const opts = shuffle(Array.from(options));
    spawnBubbles(opts);
  }

  function shuffle(arr){
    for(let i=arr.length-1;i>0;i--){
      const j = Math.floor(Math.random()*(i+1));
      [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
  }

  function spawnBubbles(values){
    const w = window.innerWidth, h = window.innerHeight;
    const zoneTop = h*0.32, zoneBottom = h*0.82;
    const cols = values.length;
    const colWidth = w / cols;

    values.forEach((val, i)=>{
      const el = document.createElement("div");
      el.className = "bubble";
      el.textContent = val;
      const color = BUBBLE_COLORS[Math.floor(Math.random()*BUBBLE_COLORS.length)];
      el.style.background = `radial-gradient(circle at 35% 30%, ${lighten(color)}, ${color})`;
      const x = colWidth*i + colWidth*0.2 + Math.random()*colWidth*0.2;
      const y = zoneTop + Math.random()*(zoneBottom-zoneTop);
      el.style.left = Math.max(8, Math.min(w-150, x)) + "px";
      el.style.top = y + "px";
      el.style.animationDelay = (Math.random()*1.2) + "s";
      el.addEventListener("pointerdown", ()=>handleTap(el, val));
      bubbleLayer.appendChild(el);
    });
  }

  function lighten(hex){
    const c = hex.replace("#","");
    const r = Math.min(255, parseInt(c.substr(0,2),16)+60);
    const g = Math.min(255, parseInt(c.substr(2,2),16)+60);
    const b = Math.min(255, parseInt(c.substr(4,2),16)+60);
    return `rgb(${r},${g},${b})`;
  }

  function handleTap(el, val){
    if(!roundActive) return;
    if(val === currentAnswer){
      el.classList.add("pop");
      burstConfetti(el);
      score++;
      scoreVal.textContent = score;
      roundActive = false;
      setTimeout(()=>{ roundActive = true; nextQuestion(); }, 260);
    } else {
      el.classList.add("shake");
      setTimeout(()=>el.classList.remove("shake"), 350);
    }
  }

  function burstConfetti(el){
    const rect = el.getBoundingClientRect();
    for(let i=0;i<14;i++){
      const p = document.createElement("div");
      p.className = "confetti";
      p.style.background = BUBBLE_COLORS[Math.floor(Math.random()*BUBBLE_COLORS.length)];
      p.style.left = (rect.left + rect.width/2 + (Math.random()*60-30)) + "px";
      p.style.top = (rect.top + rect.height/2) + "px";
      p.style.transform = `rotate(${Math.random()*360}deg)`;
      bubbleLayer.appendChild(p);
      setTimeout(()=>p.remove(), 950);
    }
  }

})();
</script>
</body>
</html>
